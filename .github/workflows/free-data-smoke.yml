name: free-data-live-smoke

on:
  workflow_dispatch:
    inputs:
      smoke_stocks:
        description: Number of real BaoStock symbols to download
        required: true
        default: "50"
        type: choice
        options:
          - "20"
          - "50"
          - "200"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free-data-smoke.yml"

permissions:
  contents: read

env:
  SMOKE_STOCKS: ${{ inputs.smoke_stocks || '20' }}

jobs:
  baostock-live-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install live data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow baostock akshare
      - name: Run real BaoStock strict smoke
        run: >-
          python run_free_v4_pipeline.py --stage smoke
          --smoke-stocks ${{ env.SMOKE_STOCKS }}
          --min-symbol-coverage 0.98
          --min-session-coverage 0.97
          --skip-akshare
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-data-live-smoke-${{ env.SMOKE_STOCKS }}
          path: |
            output/v3_8_1_smoke/
            output/free_v4_pipeline/
            data/smoke/reference/free_data_manifest.json
            data/smoke/reference/free_data_validation.json
          if-no-files-found: warn
