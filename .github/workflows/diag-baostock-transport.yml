name: diag-baostock-transport

on:
  push:
    branches:
      - fix/baostock-socketpool-timeout
    paths:
      - ".github/workflows/diag-baostock-transport.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact BaoStock
        run: python -m pip install baostock==0.9.3
      - name: Inspect installed BaoStock transport source
        shell: pwsh
        run: |
          @'
          import importlib.metadata
          import inspect
          from pathlib import Path
          import baostock
          import baostock.util.socketutil as su
          import baostock.common.context as ctx
          def escaped(value):
              return str(value).encode("unicode_escape", errors="backslashreplace").decode("ascii")
          print("BAOSTOCK_VERSION", importlib.metadata.version("baostock"))
          print("BAOSTOCK_FILE", baostock.__file__)
          print("SOCKETUTIL_FILE", su.__file__)
          print("SOCKETUTIL_ATTRS", sorted(x for x in dir(su) if "socket" in x.lower() or "connect" in x.lower() or "pool" in x.lower()))
          print("CONTEXT_ATTRS", sorted(x for x in dir(ctx) if "socket" in x.lower() or "connect" in x.lower() or "pool" in x.lower()))
          print("SOCKETUTIL_SOURCE_BEGIN")
          print(escaped(Path(su.__file__).read_text(encoding="utf-8", errors="replace")))
          print("SOCKETUTIL_SOURCE_END")
          for label, obj in [
              ("SOCKETUTIL_CLASS", su.SocketUtil),
              ("GET_DEFAULT_SOCKET", su.get_default_socket),
          ]:
              try:
                  print(label + "_SOURCE_BEGIN")
                  print(escaped(inspect.getsource(obj)))
                  print(label + "_SOURCE_END")
              except Exception as exc:
                  print(label + "_SOURCE_ERROR", repr(exc))
          '@ | python -
