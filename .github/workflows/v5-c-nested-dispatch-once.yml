name: v5-c-nested-dispatch-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v5-c-nested-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch pinned V5 C nested recovery
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v5-c-nested-research with pinned industry lineage
        env:
          GH_TOKEN: ${{ github.token }}
          INDUSTRY_RUN_ID: "33969253365"
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/v5-c-nested-research.yml/dispatches" \
            --data "{\"ref\":\"main\",\"inputs\":{\"industry_run_id\":\"${INDUSTRY_RUN_ID}\"}}"
