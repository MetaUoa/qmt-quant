name: cleanup-final-redundant-branches-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete final redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          branches = [
              "feat/v5-c6-final-integration",
              "fix/baostock-socketpool-timeout",
              "fix/v5-oos-json-int64",
          ]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "qmt-quant-final-branch-cleanup",
          }

          for name in branches:
              ref = urllib.parse.quote(f"heads/{name}", safe="/")
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/git/refs/{ref}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30):
                      pass
                  print(f"DELETED {name}")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"failed to delete {name}: HTTP {exc.code}: {detail}") from exc
          PY
