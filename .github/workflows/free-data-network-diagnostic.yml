name: free-data-network-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free-data-network-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BaoStock
        run: python -m pip install baostock
      - name: Inspect BaoStock package without network login
        shell: pwsh
        run: |
          @'
          import inspect
          from pathlib import Path
          import baostock as bs
          import baostock.common.contants as cons

          print("baostock file:", bs.__file__)
          print("constants file:", cons.__file__)
          print("BAOSTOCK_SERVER_IP:", getattr(cons, "BAOSTOCK_SERVER_IP", None))
          print("BAOSTOCK_SERVER_PORT:", getattr(cons, "BAOSTOCK_SERVER_PORT", None))
          print("login module:", bs.login.__module__)
          print("--- login source ---")
          print(inspect.getsource(bs.login))
          print("--- constants source ---")
          text = Path(cons.__file__).read_text(encoding="utf-8", errors="replace")
          for line in text.splitlines():
              if "SERVER" in line or "10030" in line or "baostock.com" in line:
                  print(line)
          '@ | python -u -
