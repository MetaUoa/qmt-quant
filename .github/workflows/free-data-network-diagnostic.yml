name: free-data-network-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free-data-network-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BaoStock
        run: python -m pip install baostock
      - name: Inspect and test BaoStock login endpoint
        shell: pwsh
        env:
          BAOSTOCK_SERVER_IP: public-api.baostock.com
          BAOSTOCK_SERVER_PORT: "10030"
        run: |
          @'
          import inspect
          import os
          import socket
          import baostock as bs
          import baostock.common.contants as cons

          print("ENV BAOSTOCK_SERVER_IP=", os.environ.get("BAOSTOCK_SERVER_IP"))
          print("CONST BAOSTOCK_SERVER_IP=", getattr(cons, "BAOSTOCK_SERVER_IP", None))
          print("CONST BAOSTOCK_SERVER_PORT=", getattr(cons, "BAOSTOCK_SERVER_PORT", None))
          print("LOGIN MODULE=", bs.login.__module__)
          try:
              print("LOGIN SOURCE=", inspect.getsource(bs.login))
          except Exception as exc:
              print("LOGIN SOURCE unavailable:", exc)

          print("Force constants to public-api.baostock.com:10030")
          cons.BAOSTOCK_SERVER_IP = "public-api.baostock.com"
          cons.BAOSTOCK_SERVER_PORT = 10030
          socket.setdefaulttimeout(10)
          lg = bs.login()
          print("LOGIN RESULT", lg.error_code, lg.error_msg)
          if str(lg.error_code) == "0":
              rs = bs.query_history_k_data_plus(
                  "sh.600000",
                  "date,code,close",
                  start_date="2025-12-01",
                  end_date="2025-12-31",
                  frequency="d",
                  adjustflag="3",
              )
              rows = 0
              while rs.error_code == "0" and rs.next():
                  rows += 1
              print("QUERY RESULT", rs.error_code, rs.error_msg, "rows=", rows)
              bs.logout()
          raise SystemExit(0 if str(lg.error_code) == "0" else 2)
          '@ | python -u -
