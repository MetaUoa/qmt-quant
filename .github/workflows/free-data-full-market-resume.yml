name: free-data-full-market-resume

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/free-data-full-market-resume.yml"

permissions:
  contents: read
  actions: read

env:
  DATA_START: "20170101"
  TRADE_START: "20180101"
  DATA_END: "20251231"
  BENCHMARK: 000905.SH
  SHARD_COUNT: "20"
  SOURCE_RUN_ID: "33811845110"
  RECOVERY_RUN_ID: "33887254974"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  QMT_QUANT_CACHE_ONLY: "1"

jobs:
  merge-and-research:
    name: Resume merge, audit, baseline and independent walk-forward
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install numpy pandas pyarrow
      - name: Download successful shards from source run
        uses: actions/download-artifact@v4
        with:
          pattern: free-data-shard-*
          path: downloaded-shards
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Remove stale shard 13 from source run
        shell: pwsh
        run: |
          $stale = "downloaded-shards/free-data-shard-13"
          if (Test-Path $stale) { Remove-Item -Recurse -Force $stale }
      - name: Download recovered shard 13
        uses: actions/download-artifact@v4
        with:
          name: free-data-shard-13-recovery
          path: downloaded-shards/free-data-shard-13
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RECOVERY_RUN_ID }}
      - name: Require exactly one complete set of 20 shard artifacts
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            $manifest = "downloaded-shards/free-data-shard-$i/reference/free_data_manifest.json"
            if (-not (Test-Path $manifest)) { throw "Missing shard manifest: $manifest" }
          }
      - name: Merge shard caches and PIT references
        run: >-
          python merge_free_data_shards.py
          --input downloaded-shards
          --reference-dir data/reference
          --bar-cache-dir data/qmt_bars
      - name: Full historical data audit
        run: >-
          python run_data_audit.py
          --start 20170101
          --end 20251231
          --benchmark 000905.SH
          --reference-dir data/reference
          --bar-cache-dir data/qmt_bars
          --output output/v4_1_full_market/data_audit
          --min-symbol-coverage 0.98
          --min-session-coverage 0.97
      - name: Strict 2018-2025 full-market baseline
        run: >-
          python run_window_baseline.py
          --data-start 20170101
          --trade-start 20180101
          --end 20251231
          --benchmark 000905.SH
          --reference-dir data/reference
          --bar-cache-dir data/qmt_bars
          --output output/v4_1_full_market/baseline
          --min-symbol-coverage 0.98
      - name: Validate baseline artifacts
        run: >-
          python validate_backtest_output.py
          output/v4_1_full_market/baseline
          --min-symbol-coverage 0.98
      - name: Independent reset-capital walk-forward
        run: >-
          python run_walk_forward.py
          --data-start 20170101
          --start 20180101
          --end 20251231
          --benchmark 000905.SH
          --reference-dir data/reference
          --bar-cache-dir data/qmt_bars
          --output output/v4_1_full_market/walk_forward
          --strict-reference
          --top-n-grid 5,8,12
          --rebalance-grid 5,10
          --min-momentum-grid 0.00,0.02
          --min-breadth-grid 0.00,0.45
          --max-train-drawdown 0.65
      - name: Upload resumed full-market research reports
        uses: actions/upload-artifact@v4
        with:
          name: qmt-full-market-v4-1-results
          path: |
            output/v4_1_full_market/
            data/reference/free_data_manifest.json
          if-no-files-found: error
          retention-days: 30
