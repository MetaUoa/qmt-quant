name: automated-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked repository dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Print resolved dependency versions
        shell: pwsh
        run: python -m pip freeze
      - name: Ruff correctness gate
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Mypy safety-contract gate
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: >-
          python -m mypy
          qmt_quant/production_candidate.py
          qmt_quant/v5_gates.py
          qmt_quant/adjustment_provenance.py
          qmt_quant/backtest_execution.py
          qmt_quant/backtest_reporting.py
          qmt_quant/research_policy.py
          qmt_quant/research_contracts.py
          qmt_quant/research_runtime.py
          risk/runtime.py
          monitoring/alerts.py
          --ignore-missing-imports
          --check-untyped-defs
      - name: Run automated offline tests
        shell: pwsh
        run: python run_automated_tests.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: output/test_reports/
